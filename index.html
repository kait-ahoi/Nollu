<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nollu's Mouse Hunt</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0820; overflow:hidden; width:100vw; height:100vh; font-family:Georgia,serif; cursor:none; user-select:none; }
  #nollu-container { position:absolute; top:0; left:0; right:0; height:67vh; overflow:hidden; pointer-events:none; }
  #nollu-img { width:100%; height:100%; object-fit:cover; object-position:center 15%; display:block;
    mask-image:linear-gradient(to bottom,black 0%,black 55%,transparent 100%);
    -webkit-mask-image:linear-gradient(to bottom,black 0%,black 55%,transparent 100%); }
  #floor { position:absolute; top:67vh; left:0; right:0; height:2px;
    background:linear-gradient(90deg,transparent,#a67bc8 20%,#e8c0f5 50%,#a67bc8 80%,transparent);
    box-shadow:0 0 12px #9b6bc8; z-index:10; pointer-events:none; }
  #playzone { position:absolute; top:67vh; left:0; right:0; bottom:0;
    background:radial-gradient(ellipse at 50% 100%,#1a0d3a 0%,#0d0820 100%); z-index:1; pointer-events:none; }
  #ui { position:absolute; top:16px; left:0; right:0; display:flex; justify-content:space-between; padding:0 36px; z-index:100; pointer-events:none; }
  .ui-box { background:rgba(10,5,20,0.55); border:1px solid rgba(255,255,255,0.12); border-radius:14px;
    padding:8px 22px; color:#e8d5f5; font-size:26px; letter-spacing:2px; text-shadow:0 0 16px #c89ef5; backdrop-filter:blur(10px); }
  .ui-label { font-size:10px; color:#9b7cc4; letter-spacing:4px; text-transform:uppercase; display:block; margin-bottom:2px; }
  #canvas { position:absolute; inset:0; pointer-events:none; z-index:60; }
  #paw { position:fixed; width:90px; height:90px; pointer-events:none; transform:translate(-50%,-50%); z-index:200; }
  #catchflash { position:absolute; inset:0; pointer-events:none; opacity:0; z-index:150; transition:opacity 0.1s;
    background:radial-gradient(circle at var(--fx,50%) var(--fy,50%),rgba(255,220,100,0.35) 0%,transparent 55%); }
  #combo { position:absolute; top:110px; right:36px; color:#ffd700; font-size:24px; letter-spacing:3px;
    text-shadow:0 0 18px #ffaa00; z-index:100; pointer-events:none; opacity:0; transition:opacity 0.3s; }
  #titlescreen { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; z-index:300; background:rgba(10,5,20,0.8); backdrop-filter:blur(8px); cursor:pointer; }
  #titlescreen h1 { font-size:96px; color:#e8d5f5; letter-spacing:8px; margin-bottom:8px;
    text-shadow:0 0 50px #c89ef5,0 0 100px #9b6bc4; animation:glow-pulse 2s ease-in-out infinite; }
  .subtitle { font-size:22px; color:#9b7cc4; letter-spacing:10px; margin-bottom:40px; }
  .cat-preview { width:190px; height:190px; border-radius:50%; object-fit:cover; object-position:center 15%;
    margin-bottom:36px; border:3px solid rgba(200,158,245,0.5); animation:cat-glow 2s ease-in-out infinite; }
  .start-hint { font-size:22px; color:#c89ef5; letter-spacing:6px; animation:blink 1.5s step-end infinite; margin-bottom:14px; }
  .controls-hint { font-size:14px; color:#5a3c7a; letter-spacing:3px; }
  @keyframes glow-pulse { 0%,100%{text-shadow:0 0 50px #c89ef5,0 0 100px #9b6bc4} 50%{text-shadow:0 0 80px #e8d5f5,0 0 160px #c89ef5} }
  @keyframes cat-glow { 0%,100%{box-shadow:0 0 40px rgba(200,158,245,0.4)} 50%{box-shadow:0 0 70px rgba(200,158,245,0.75)} }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  @keyframes pop-up { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-90px) scale(1.5)} }
  @keyframes speed-fade { from{opacity:.9} to{opacity:0} }
</style>
</head>

<script>

const W = () => window.innerWidth;
const H = () => window.innerHeight;
const PLAY_TOP = () => H() * 0.67 + 10;
const PLAY_BOT = () => H() - 24;

let score = 0, hiScore = 0, combo = 0, comboTimer = null;
let gameActive = false;
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const particles = [];
const paw = { x: 0, y: 0 };
const pawEl = document.getElementById('paw');

function resize() { canvas.width = W(); canvas.height = H(); }
resize();
window.addEventListener('resize', resize);

// ── SVGs ──────────────────────────────────────────
function mouseSVG(size, facingLeft, c1, c2) {
  c1 = c1 || '#c8a0d8'; c2 = c2 || '#d4b0e0';

  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 70 70" ' + fl + '>'
    + '<path d="M6 42 Q-8 24 4 12" stroke="#d4a0c8" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    + '<ellipse cx="35" cy="46" rx="22" ry="16" fill="' + c1 + '"/>'
    + '<circle cx="50" cy="34" r="15" fill="' + c2 + '"/>'
    + '<polygon points="42,19 38,10 47,15" fill="#e8c0f0"/>'
    + '<polygon points="58,19 62,10 54,15" fill="#e8c0f0"/>'
    + '<polygon points="42.5,18 39,12 46,15" fill="#f5a0c8"/>'

    + '<circle cx="56" cy="33" r="1.8" fill="white"/>'
    + '<line x1="64" y1="31" x2="73" y2="29" stroke="#c0a0d0" stroke-width="1.2"/>'
    + '<line x1="64" y1="34" x2="74" y2="34" stroke="#c0a0d0" stroke-width="1.2"/>'
    + '<line x1="64" y1="37" x2="73" y2="39" stroke="#c0a0d0" stroke-width="1.2"/>'
    + '<ellipse cx="63" cy="35" rx="2.5" ry="2" fill="#f5a0c8"/>'
    + '<ellipse cx="26" cy="60" rx="8" ry="5" fill="#b890c8"/>'
    + '<ellipse cx="42" cy="60" rx="8" ry="5" fill="#b890c8"/>'
    + '</svg>';
}

function spiderSVG(size) {
  return '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '" viewBox="0 0 80 80">'

    + '<line x1="28" y1="45" x2="6"  y2="58" stroke="#333" stroke-width="3" stroke-linecap="round"/>'

    + '<line x1="50" y1="36" x2="72" y2="22" stroke="#333" stroke-width="3" stroke-linecap="round"/>'
    + '<line x1="52" y1="40" x2="76" y2="38" stroke="#333" stroke-width="3" stroke-linecap="round"/>'

function pawSVG(pressed) {
  var c = pressed ? '#ff7777' : '#ffccaa';
  var p = pressed ? '#ee3333' : '#ff9999';
  var cl = pressed
    ? '<line x1="22" y1="12" x2="15" y2="-1" stroke="#cc2222" stroke-width="3" stroke-linecap="round"/>'
      + '<line x1="40" y1="8" x2="40" y2="-5" stroke="#cc2222" stroke-width="3" stroke-linecap="round"/>'
      + '<line x1="58" y1="12" x2="65" y2="-1" stroke="#cc2222" stroke-width="3" stroke-linecap="round"/>'
    : '';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80">'
    + '<ellipse cx="22" cy="20" rx="11" ry="13" fill="' + c + '" opacity="0.93"/>'
    + '<ellipse cx="40" cy="13" rx="11" ry="13" fill="' + c + '" opacity="0.93"/>'
    + '<ellipse cx="58" cy="20" rx="11" ry="13" fill="' + c + '" opacity="0.93"/>'
    + '<ellipse cx="40" cy="50" rx="25" ry="27" fill="' + c + '" opacity="0.93"/>'
    + '<ellipse cx="40" cy="52" rx="15" ry="16" fill="' + p + '" opacity="0.72"/>'

}

// ── Audio ──────────────────────────────────────────
var audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playSpiderSound() {
  try {
    var ac = getAudioCtx();
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(180, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(60, ac.currentTime + 0.4);
    gain.gain.setValueAtTime(0.18, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.5);
    osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.5);
  } catch(e) {}
}
function playCatchSound() {
  try {
    var ac = getAudioCtx();
    var osc = ac.createOscillator();
    var gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(1200, ac.currentTime + 0.15);
    gain.gain.setValueAtTime(0.2, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.2);
    osc.start(ac.currentTime); osc.stop(ac.currentTime + 0.2);
  } catch(e) {}
}

// ── Creature ──────────────────────────────────────
function Creature(type, size) {
  this.type = type;
  this.size = size;
  this.x = W() * (0.15 + Math.random() * 0.7);
  this.y = PLAY_TOP() + 10 + Math.random() * (PLAY_BOT() - PLAY_TOP() - 20);
  this.vx = (Math.random() - 0.5) * (type === 'spider' ? 3 : 5);
  this.vy = (Math.random() - 0.5) * (type === 'spider' ? 2 : 3);
  this.speed = type === 'spider' ? 2.5 : (3.5 + Math.random() * 2);
  this.prevX = this.x;
  this.dashTimer = null;
  this.alive = true;
  this.alpha = 1;
  this.fadeTimer = null;
  this.noiseInterval = null;
  var colors = [['#c8a0d8','#d4b0e0'],['#a0c4d8','#b0d4e8'],['#d8c0a0','#e8d0b0'],['#a0d8b8','#b0e8c8']];
  var ci = Math.floor(Math.random() * colors.length);
  this.color1 = colors[ci][0];
  this.color2 = colors[ci][1];

  this.el = document.createElement('div');
  this.el.style.cssText = 'position:absolute;pointer-events:none;transform:translate(-50%,-50%);z-index:50;width:' + size + 'px;height:' + size + 'px;';
  document.body.appendChild(this.el);

  if (type === 'spider') {
    var self = this;
    var lifespan = 6000 + Math.random() * 8000;
    this.fadeTimer = setTimeout(function() { if(self.alive) self.startFade(); }, lifespan);
    this.noiseInterval = setInterval(function() { if(self.alive) playSpiderSound(); }, 2500 + Math.random() * 3000);
  }
  this.render();
}

Creature.prototype.render = function() {
  this.el.innerHTML = this.type === 'mouse'
    ? mouseSVG(this.size, this.x < this.prevX, this.color1, this.color2)
    : spiderSVG(this.size);
  this.el.style.left = this.x + 'px';
  this.el.style.top  = this.y + 'px';
  this.el.style.opacity = this.alpha;
  if (this.type === 'spider') {
    this.el.style.filter = 'drop-shadow(0 0 8px #ff2200)';
  } else {
    this.el.style.filter = 'drop-shadow(0 0 8px rgba(255,200,100,0.7))';
  }
};

Creature.prototype.startFade = function() {
  this.alive = false;
  if (this.noiseInterval) { clearInterval(this.noiseInterval); this.noiseInterval = null; }
  var self = this;
  var a = 1;
  var fade = setInterval(function() {
    a -= 0.05;
    self.alpha = Math.max(0, a);
    self.el.style.opacity = self.alpha;
    if (a <= 0) { clearInterval(fade); self.remove(); }
  }, 50);
};

Creature.prototype.remove = function() {
  clearTimeout(this.fadeTimer);
  if (this.noiseInterval) clearInterval(this.noiseInterval);
  if (this.el.parentNode) this.el.parentNode.removeChild(this.el);
};

Creature.prototype.update = function() {
  var topB = PLAY_TOP() + this.size * 0.5;
  var botB = PLAY_BOT() - this.size * 0.5;
  var lftB = this.size * 0.5;
  var rgtB = W() - this.size * 0.5;

  if (this.type === 'mouse') {
    if (!this.dashTimer && Math.random() < 0.007) {
      var angle = Math.random() * Math.PI * 2;
      this.vx = Math.cos(angle) * this.speed * 3.5;
      this.vy = Math.sin(angle) * this.speed * 3.5;
      spawnSpeedLines(this.x, this.y, angle);
      var self = this;
      this.dashTimer = setTimeout(function(){ self.dashTimer = null; }, 550);
    } else if (!this.dashTimer) {
      this.vx += (Math.random() - 0.5) * 0.9;
      this.vy += (Math.random() - 0.5) * 0.5;
      if (Math.random() < 0.012) {
        this.vx += (paw.x - this.x) * 0.01;
        this.vy += (paw.y - this.y) * 0.008;
      }
      var s = Math.hypot(this.vx, this.vy);
      if (s > this.speed) { this.vx = this.vx/s*this.speed; this.vy = this.vy/s*this.speed; }
    }
  } else {
    this.vx += (Math.random() - 0.5) * 0.5;
    this.vy += (Math.random() - 0.5) * 0.3;
    var s = Math.hypot(this.vx, this.vy);
    if (s > this.speed) { this.vx = this.vx/s*this.speed; this.vy = this.vy/s*this.speed; }
  }

  var dx = this.x - paw.x, dy = this.y - paw.y;
  var dist = Math.hypot(dx, dy);
  var fleeR = this.type === 'spider' ? 120 : 160;
  if (dist < fleeR && dist > 1) {
    this.vx += (dx/dist) * (this.type === 'spider' ? 1.2 : 1.8);
    this.vy += (dy/dist) * (this.type === 'spider' ? 0.8 : 1.8);
  }

  this.prevX = this.x;
  this.x += this.vx; this.y += this.vy;
  if (this.x < lftB) { this.x = lftB; this.vx = Math.abs(this.vx); }
  if (this.x > rgtB) { this.x = rgtB; this.vx = -Math.abs(this.vx); }
  if (this.y < topB) { this.y = topB; this.vy = Math.abs(this.vy); }
  if (this.y > botB) { this.y = botB; this.vy = -Math.abs(this.vy); }
  this.render();
};

Creature.prototype.hitTest = function(tx, ty) {
  return Math.hypot(tx - this.x, ty - this.y) < this.size * 0.7;
};

// ── Creatures list ─────────────────────────────────
var creatures = [];

function spawnCreatures() {
  creatures.push(new Creature('mouse', 46));
  creatures.push(new Creature('mouse', 68));
  creatures.push(new Creature('mouse', 92));
}

function maybeSpawnSpider() {
  if (!gameActive) return;
  var spiders = creatures.filter(function(c){ return c.type==='spider' && c.alive; });
  if (spiders.length < 1) {
    creatures.push(new Creature('spider', 72));
  }
}

// ── Particles ──────────────────────────────────────
function spawnCatchParticles(x, y, isSpider) {
  var colors = isSpider
    ? ['#ff4444','#ff8800','#ffff00','#ffffff']
    : ['#ffd700','#ff88cc','#88ffcc','#ffaa44','#ffffff'];
  for (var i = 0; i < 22; i++) {
    var angle = (i/22)*Math.PI*2;
    var sp = 3 + Math.random()*8;
    particles.push({ x:x, y:y, vx:Math.cos(angle)*sp, vy:Math.sin(angle)*sp,
      life:1, size:4+Math.random()*7, color:colors[Math.floor(Math.random()*colors.length)] });
  }
  for (var j = 0; j < 7; j++) {
    particles.push({ x:x+(Math.random()-.5)*80, y:y+(Math.random()-.5)*40,
      vx:(Math.random()-.5)*2, vy:-2-Math.random()*3, life:1, size:10+Math.random()*10, color:'#ffd700', star:true });
  }
}

function drawParticles() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for (var i = particles.length-1; i>=0; i--) {
    var p = particles[i];
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.18; p.life-=0.022;
    if (p.life<=0) { particles.splice(i,1); continue; }
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    if (p.star) { ctx.font=p.size+'px serif'; ctx.fillText('⭐',p.x,p.y); }
    else { ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

function spawnSpeedLines(x, y, angle) {
  for (var i=0; i<5; i++) {
    var line = document.createElement('div');
    line.style.cssText = 'position:absolute;height:2px;pointer-events:none;z-index:40;animation:speed-fade 0.4s ease-out forwards;background:linear-gradient(90deg,rgba(255,200,100,0.7),transparent);';
    var len = 40+Math.random()*70;
    line.style.width = len+'px';
    line.style.left = (x-len)+'px';
    line.style.top = (y+(Math.random()-.5)*30)+'px';
    line.style.transform = 'rotate(' + (angle*180/Math.PI) + 'deg)';
    document.body.appendChild(line);
    setTimeout(function(){ if(line.parentNode) line.parentNode.removeChild(line); }, 400);
  }
}

// ── Catch ──────────────────────────────────────────
function handleCatch(tx, ty) {
  for (var i = creatures.length-1; i>=0; i--) {
    var c = creatures[i];
    if (!c.alive) continue;
    if (c.hitTest(tx, ty)) {
      var isSpider = c.type === 'spider';
      var pts = isSpider ? 5 : (c.size > 80 ? 1 : c.size > 55 ? 2 : 3);
      combo++;
      var totalPts = combo >= 3 ? pts * combo : pts;
      score += totalPts;
      hiScore = Math.max(hiScore, score);
      document.getElementById('score').textContent = score;
      document.getElementById('hiscore').textContent = hiScore;

      if (combo >= 2) {
        var cel = document.getElementById('combo');
        cel.textContent = combo + 'x COMBO! +' + totalPts;
        cel.style.opacity = 1;
        if (comboTimer) clearTimeout(comboTimer);
        comboTimer = setTimeout(function(){ cel.style.opacity=0; combo=0; }, 1800);
      }

      var flash = document.getElementById('catchflash');
      flash.style.setProperty('--fx',(tx/W()*100)+'%');
      flash.style.setProperty('--fy',(ty/H()*100)+'%');
      flash.style.opacity = 1;
      setTimeout(function(){ flash.style.opacity=0; }, 150);

      spawnCatchParticles(tx, ty, isSpider);
      playCatchSound();

      var pop = document.createElement('div');
      pop.style.cssText = 'position:absolute;pointer-events:none;z-index:180;font-size:40px;font-weight:bold;color:#ffd700;text-shadow:0 0 16px #ffaa00;animation:pop-up 1s ease-out forwards;';
      pop.textContent = isSpider ? ('🕷️ +'+totalPts+'!') : ('+'+totalPts+(combo>=3?' 🔥':' ⭐'));
      pop.style.left = (tx-40)+'px';
      pop.style.top  = (ty-60)+'px';
      document.body.appendChild(pop);
      setTimeout(function(){ if(pop.parentNode) pop.parentNode.removeChild(pop); }, 1000);

      pawEl.innerHTML = pawSVG(true);
      setTimeout(function(){ pawEl.innerHTML = pawSVG(false); }, 220);

      if (isSpider) {
        c.startFade();
        creatures.splice(i,1);
        setTimeout(maybeSpawnSpider, 10000+Math.random()*8000);
      } else {
        var escAngle = Math.atan2(ty-c.y, tx-c.x) + Math.PI + (Math.random()-.5)*.8;
        c.vx = Math.cos(escAngle)*c.speed*4;
        c.vy = Math.sin(escAngle)*c.speed*4;
      }
      return true;
    }
  }
  return false;
}

// ── Input ──────────────────────────────────────────
function handleInput(x, y) {
  if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (!gameActive) { startGame(); return; }
  handleCatch(x, y);
}

document.addEventListener('click', function(e) { handleInput(e.clientX, e.clientY); });
document.addEventListener('touchstart', function(e) {
  e.preventDefault();
  var t = e.touches[0];
  handleInput(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('mousemove', function(e) {
  paw.x=e.clientX; paw.y=e.clientY;
  pawEl.style.left=e.clientX+'px'; pawEl.style.top=e.clientY+'px';
});
document.addEventListener('touchmove', function(e) {
  e.preventDefault();
  var t=e.touches[0];
  paw.x=t.clientX; paw.y=t.clientY;
  pawEl.style.left=t.clientX+'px'; pawEl.style.top=t.clientY+'px';
}, { passive:false });
document.addEventListener('keydown', function(e) {
  if (!gameActive && (e.key==='Enter'||e.key===' ')) { startGame(); return; }
  var step=50;
  if (e.key==='ArrowLeft')  { paw.x=Math.max(0,paw.x-step); pawEl.style.left=paw.x+'px'; }
  if (e.key==='ArrowRight') { paw.x=Math.min(W(),paw.x+step); pawEl.style.left=paw.x+'px'; }
  if (e.key==='ArrowUp')    { paw.y=Math.max(0,paw.y-step); pawEl.style.top=paw.y+'px'; }
  if (e.key==='ArrowDown')  { paw.y=Math.min(H(),paw.y+step); pawEl.style.top=paw.y+'px'; }
  if (e.key==='Enter')      { if(gameActive) handleCatch(paw.x,paw.y); }
  e.preventDefault();
});

// ── Game loop ──────────────────────────────────────
var spiderSpawnInterval = null;

function gameLoop() {
  for (var i=0; i<creatures.length; i++) {
    if (creatures[i].alive) creatures[i].update();
  }
  drawParticles();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('titlescreen').style.display = 'none';
  gameActive = true;
  score = 0; combo = 0;
  document.getElementById('score').textContent = '0';
  pawEl.innerHTML = pawSVG(false);
  paw.x = W()/2; paw.y = H()*0.84;
  pawEl.style.left = paw.x+'px';
  pawEl.style.top  = paw.y+'px';
  spawnCreatures();
  setTimeout(function() {
    maybeSpawnSpider();
    spiderSpawnInterval = setInterval(maybeSpawnSpider, 12000+Math.random()*8000);
  }, 8000);
}

pawEl.innerHTML = pawSVG(false);
paw.x = W()/2; paw.y = H()*0.84;
pawEl.style.left = paw.x+'px';
pawEl.style.top  = paw.y+'px';
gameLoop();

</script>
